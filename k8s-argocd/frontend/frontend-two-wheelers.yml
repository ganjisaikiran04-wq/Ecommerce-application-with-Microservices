apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: frontend-two-wheelers
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/ganjisaikiran04-wq/Ecommerce-application-with-Microservices.git
    targetRevision: main
    path: frontend/two-wheelers

  destination:
    server: https://kubernetes.default.svc
    namespace: microservices

  syncPolicy:
    automated:
      prune: false
      selfHeal: true
