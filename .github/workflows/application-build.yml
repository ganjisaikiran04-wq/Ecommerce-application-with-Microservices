##GCP 
name: CI/CD for Ecommerce App - GCP

on:
  workflow_dispatch:

  # Uncomment to enable automatic builds on pushes to main
  # push:
  #   branches:
  #     - main

env:
  GCP_PROJECT_ID: project-52cd4603-7486-4332-bab
  GCP_PROJECT_NUMBER: "915496736487"
  GCP_REGION: us-central1
  GAR_REPOSITORY: ecomapp

  FRONTEND_SERVICES: "main appliances auto beauty books computers earphones electronics fashion food furniture googlegrocery googlemusic googlepay home mobiles sports toys two-wheelers"

permissions:
  contents: write
  id-token: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GIT_PAT }}
          ref: ${{ github.ref }}
          fetch-depth: 0
          persist-credentials: true

      # 2. Authenticate using Workload Identity Federation
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/915496736487/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: github-actions-deployer@project-52cd4603-7486-4332-bab.iam.gserviceaccount.com
          project_id: project-52cd4603-7486-4332-bab

      # 3. Set up Google Cloud CLI
      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: project-52cd4603-7486-4332-bab

      # 4. Configure Docker authentication
      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker \
            "${GCP_REGION}-docker.pkg.dev" --quiet

      # 5. Build and push frontend and backend images
      - name: Build and Push Docker Images
        shell: bash
        run: |
          set -Eeuo pipefail

          IMAGE_TAG="${GITHUB_SHA}"
          REGISTRY="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${GAR_REPOSITORY}"

          echo "Project: ${GCP_PROJECT_ID}"
          echo "Registry: ${REGISTRY}"
          echo "Image tag: ${IMAGE_TAG}"

          # Verify Artifact Registry repository
          gcloud artifacts repositories describe "${GAR_REPOSITORY}" \
            --project="${GCP_PROJECT_ID}" \
            --location="${GCP_REGION}"

          # Build and push frontend images
          for service in ${FRONTEND_SERVICES}; do
            FOLDER="frontend/${service}"
            DEPLOYMENT_FILE="${FOLDER}/deployment.yml"
            IMAGE_NAME="shopping-site-${service}"
            IMAGE_URI="${REGISTRY}/${IMAGE_NAME}:${IMAGE_TAG}"

            if [[ ! -f "${FOLDER}/Dockerfile" ]]; then
              echo "::error::Dockerfile not found: ${FOLDER}/Dockerfile"
              exit 1
            fi

            if [[ ! -f "${DEPLOYMENT_FILE}" ]]; then
              echo "::error::Deployment manifest not found: ${DEPLOYMENT_FILE}"
              exit 1
            fi

            echo "Building frontend: ${service}"

            docker build --pull -t "${IMAGE_URI}" "${FOLDER}"
            docker push "${IMAGE_URI}"

            IMAGE_COUNT=$(grep -Ec \
              '^[[:space:]]*image:[[:space:]]*' \
              "${DEPLOYMENT_FILE}" || true)

            if [[ "${IMAGE_COUNT}" -ne 1 ]]; then
              echo "::error::Expected exactly one image field in ${DEPLOYMENT_FILE}; found ${IMAGE_COUNT}"
              exit 1
            fi

            sed -i -E \
              "s|^([[:space:]]*image:[[:space:]]*).*|\1${IMAGE_URI}|" \
              "${DEPLOYMENT_FILE}"

            echo "Updated ${DEPLOYMENT_FILE}"
          done

          # Build and push backend image
          FOLDER="backend"
          DEPLOYMENT_FILE="backend/backend-deployment.yml"
          IMAGE_URI="${REGISTRY}/shopping-site-backend:${IMAGE_TAG}"

          if [[ ! -f "${FOLDER}/Dockerfile" ]]; then
            echo "::error::Backend Dockerfile not found: ${FOLDER}/Dockerfile"
            exit 1
          fi

          if [[ ! -f "${DEPLOYMENT_FILE}" ]]; then
            echo "::error::Backend deployment manifest not found: ${DEPLOYMENT_FILE}"
            exit 1
          fi

          echo "Building backend"

          docker build --pull -t "${IMAGE_URI}" "${FOLDER}"
          docker push "${IMAGE_URI}"

          IMAGE_COUNT=$(grep -Ec \
            '^[[:space:]]*image:[[:space:]]*' \
            "${DEPLOYMENT_FILE}" || true)

          if [[ "${IMAGE_COUNT}" -ne 1 ]]; then
            echo "::error::Expected exactly one image field in ${DEPLOYMENT_FILE}; found ${IMAGE_COUNT}"
            exit 1
          fi

          sed -i -E \
            "s|^([[:space:]]*image:[[:space:]]*).*|\1${IMAGE_URI}|" \
            "${DEPLOYMENT_FILE}"

          echo "Updated ${DEPLOYMENT_FILE}"

      # 6. Commit updated deployment manifests
      - name: Commit updated deployment manifests
        shell: bash
        run: |
          set -Eeuo pipefail

          git config user.name "GitHub Actions"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add frontend/*/deployment.yml \
                  backend/backend-deployment.yml

          if git diff --cached --quiet; then
            echo "No manifest changes to commit"
            exit 0
          fi

          git commit -m "Update GCP image tags [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      # 7. Display image information
      - name: Display published image references
        shell: bash
        run: |
          set -Eeuo pipefail

          REGISTRY="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${GAR_REPOSITORY}"

          echo "Images pushed to: ${REGISTRY}"
          echo "Image tag: ${GITHUB_SHA}"
